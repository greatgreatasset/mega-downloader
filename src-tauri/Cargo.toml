# Standalone workspace so Tauri's GUI dependency tree stays out of the engine build.
[workspace]

[package]
name = "mega-downloader-desktop"
version = "0.1.0"
edition = "2021"
description = "MEGA Structured Downloader desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
